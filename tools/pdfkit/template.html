<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>{fulltitle}</title>
<style>
@page {{ size: A4; margin: 16mm 15mm 16mm 15mm; }}
@page :first {{ margin: 0; }}
:root {{ --c: {color}; --cl: color-mix(in srgb, {color} 9%, white); --cm: color-mix(in srgb, {color} 35%, white); }}
* {{ box-sizing: border-box; }}
html {{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }}
body {{ margin: 0; font-family: "Noto Sans CJK KR", "Noto Sans KR", sans-serif; font-size: 10.6pt; line-height: 1.62; color: #1b1f2a; word-break: keep-all; overflow-wrap: anywhere; }}
.mk {{ font-size: 1px; color: rgba(0,0,0,0); line-height: 0; }}
sub, sup {{ font-size: 72%; line-height: 0; }}

/* cover */
.cover {{ height: 297mm; width: 210mm; position: relative; page-break-after: always; overflow: hidden; background: #fbfbfd; }}
.cover .band {{ position: absolute; left: 0; top: 0; bottom: 0; width: 24mm; background: var(--c); }}
.cover .inner {{ position: absolute; left: 38mm; right: 20mm; top: 52mm; }}
.cover .kicker {{ font-size: 11pt; letter-spacing: .25em; color: var(--c); font-weight: 800; }}
.cover h1 {{ font-size: 30pt; line-height: 1.25; margin: 6mm 0 4mm; font-weight: 900; letter-spacing: -.02em; }}
.cover .sub {{ font-size: 12pt; color: #555; }}
.cover .meta {{ margin-top: 18mm; border-top: 2px solid var(--c); padding-top: 6mm; display: grid; grid-template-columns: 28mm 1fr; row-gap: 2.5mm; font-size: 10.5pt; }}
.cover .meta b {{ color: var(--c); }}
.cover .legend {{ position: absolute; left: 38mm; right: 20mm; bottom: 26mm; font-size: 9pt; color: #555; border: 1px solid #ddd; border-radius: 3mm; padding: 4mm 5mm; background: #fff; }}
.cover .legend b {{ color: #222; }}
.cover .big {{ position: absolute; right: 16mm; top: 14mm; font-size: 64pt; font-weight: 900; color: var(--cm); letter-spacing: -.04em; }}

/* toc */
.toc {{ page-break-after: always; }}
.toc h2.th {{ font-size: 18pt; margin: 0 0 6mm; border-bottom: 3px solid var(--c); padding-bottom: 2mm; color: var(--c); }}
.toc .t2, .toc .t3 {{ display: flex; align-items: baseline; gap: 2mm; }}
.toc .t2 {{ font-weight: 700; margin-top: 2.6mm; font-size: 10.8pt; }}
.toc .t3 {{ padding-left: 7mm; font-size: 9.6pt; color: #444; margin-top: .6mm; }}
.toc a {{ color: inherit; text-decoration: none; }}
.toc .dots {{ flex: 1; border-bottom: 1px dotted #aaa; transform: translateY(-1mm); }}
.toc .pg {{ min-width: 7mm; text-align: right; font-variant-numeric: tabular-nums; }}

/* body */
.doc h2 {{ font-size: 15pt; color: #fff; background: var(--c); margin: 9mm 0 4mm; padding: 2.4mm 4mm; border-radius: 2mm; page-break-after: avoid; break-after: avoid; }}
.doc h3 {{ font-size: 12pt; color: var(--c); margin: 6mm 0 2.5mm; padding-left: 3mm; border-left: 4px solid var(--c); page-break-after: avoid; break-after: avoid; }}
.doc h4 {{ font-size: 10.8pt; margin: 4mm 0 2mm; break-after: avoid; }}
.doc p {{ margin: 1.6mm 0; text-align: left; }}
.doc ul, .doc ol {{ margin: 1.5mm 0; padding-left: 6mm; }}
.doc li {{ margin: .7mm 0; }}
.doc hr {{ border: 0; height: 0; margin: 4mm 0; }}
.doc code {{ font-family: "Noto Sans Mono CJK KR", monospace; font-size: 9pt; background: #f1f3f8; padding: .2mm 1.2mm; border-radius: 1mm; }}
.doc pre {{ background: #f5f6fa; border: 1px solid #e2e5ee; border-radius: 2mm; padding: 3mm; font-size: 8.8pt; white-space: pre-wrap; break-inside: avoid; }}
.doc pre code {{ background: none; padding: 0; }}
.eq {{ text-align: center; font-size: 11.6pt; margin: 2.6mm 0; padding: 2.4mm 4mm; background: #f7f8fc; border-radius: 2mm; break-inside: avoid; line-height: 1.75; }}
.tw {{ margin: 2.5mm 0; break-inside: auto; }}
table {{ border-collapse: collapse; width: 100%; font-size: 9.4pt; }}
th, td {{ border: 1px solid #d7dbe6; padding: 1.4mm 2mm; vertical-align: top; text-align: left; }}
th {{ background: var(--cl); color: #1b1f2a; font-weight: 700; }}
tr {{ break-inside: avoid; }}
td:first-child, th:first-child {{ white-space: nowrap; }}
.box {{ border-radius: 2.4mm; margin: 3mm 0; padding: 2.6mm 4mm 2.4mm; break-inside: avoid; position: relative; }}
.box .bt {{ font-size: 8pt; font-weight: 900; margin-bottom: 1mm; }}
.box p {{ margin: 1mm 0; }}
.box.key {{ border: 2.4px solid var(--c); background: var(--cl); }}
.box.key .bt {{ color: var(--c); }}
.box.key .bt::before {{ content: "★ "; }}
.box.def {{ border: 1.6px solid var(--c); background: #fff; }}
.box.def .bt {{ color: var(--c); }}
.box.def .bt::before {{ content: "▣ "; }}
.box.trap {{ border: 1.4px solid #d9480f; background: #fff7f2; }}
.box.trap .bt {{ color: #d9480f; }}
.box.quote {{ border: 1px solid #cfd4e2; border-left: 4px solid var(--cm); background: #fafbfd; }}
.box.quote .bt {{ color: #667; }}
.box.quote .bt::before {{ content: "❝ "; }}
div.box > p:first-child:has(> .bt) {{ margin: 0 0 1.2mm; }}
.box .bt {{ display: block; font-weight: 800; font-size: 9.6pt; color: #1b1f2a; }}
.box .bt::before {{ display: inline-block; font-size: 7.6pt; font-weight: 900; letter-spacing: .1em; margin-right: 2mm; padding: .3mm 1.6mm; border-radius: 1mm; color: #fff; background: var(--c); vertical-align: .3mm; }}
.box.thm {{ border: 2.4px solid var(--c); background: var(--cl); }}
.box.thm .bt::before {{ content: "★ KEY"; }}
.box.def .bt::before {{ content: "▣ DEFINITION"; }}
.box.example {{ border: 1.2px solid #b9c0d4; background: #fff; }}
.box.example .bt::before {{ content: "EXAMPLE"; background: #5b6478; }}
.box.sol {{ border-left: 4px solid var(--cm); background: #fafbfe; border-radius: 0 2.4mm 2.4mm 0; }}
.box.sol .bt::before {{ content: "풀이"; background: var(--cm); color: #10204d; }}
.box.warn {{ border: 1.4px solid #d9480f; background: #fff7f2; }}
.box.warn .bt::before {{ content: "⚠ TRAP"; background: #d9480f; }}
.box.intuition {{ border: 1.3px dashed var(--cm); background: #fbfcff; }}
.box.intuition .bt::before {{ content: "💡 INTUITION"; background: #7c8bb8; }}
.box.note {{ border: 1px solid #cfd4e2; background: #f8f9fc; }}
.box.note .bt::before {{ content: "NOTE"; background: #8a93a8; }}
.box.erratum {{ border: 1.6px solid #c92a2a; background: #fff5f5; }}
.box.erratum .bt::before {{ content: "ERRATUM"; background: #c92a2a; }}
.box.quote .bt::before {{ content: "❝ 원문"; background: #8a93a8; }}
.box.def {{ border: 1.6px solid var(--c); background: #fff; }}
.chk {{ background: #ffe3e3; color: #c92a2a; font-weight: 800; padding: 0 1.4mm; border-radius: 1mm; font-size: 8.6pt; }}
math[display="block"] {{ margin: 2.4mm 0; font-size: 112%; overflow-x: hidden; }}
math {{ font-family: "STIX Two Math", "Latin Modern Math", "Cambria Math", serif; }}
p.warn, li.warn {{ background: #fff4ec; border-left: 3px solid #e8590c; padding: .8mm 2.5mm; border-radius: 0 1.5mm 1.5mm 0; }}
.fig {{ border: 1.4px dashed var(--cm); background: #fbfcff; border-radius: 2mm; padding: 2.4mm 4mm; margin: 3mm 0; font-size: 9.2pt; color: #445; break-inside: avoid; }}
.fig span {{ display: block; font-size: 8pt; font-weight: 900; color: var(--c); letter-spacing: .12em; margin-bottom: .6mm; }}
.figi {{ color: #445; font-size: 9pt; }}
.cb {{ display: inline-block; width: 3.2mm; height: 3.2mm; border: 1.3px solid var(--c); border-radius: .7mm; margin-right: 1.6mm; vertical-align: -0.4mm; }}
.doc li:has(> .cb) {{ list-style: none; margin-left: -5mm; }}
b, strong {{ color: #0f1530; }}
</style></head>
<body>
<section class="cover">
  <div class="band"></div><div class="big">{abbr}</div>
  <div class="inner">
    <div class="kicker">{code} · {label}</div>
    <h1>{title}</h1>
    <div class="sub">{subject} 정리본</div>
    <div class="meta">
      <b>과목</b><span>{subject} ({code}) · {prof} 교수</span>
      <b>범위</b><span>{label}</span>
      <b>시험</b><span>{exam}</span>
    </div>
  </div>
  <div class="legend"><b>출처 표시</b> — (칠판) 수업에서 다룬 내용 · (교재) 교재로 보강 · (보충) 판서·교재에 없는 설명 · ⚠️ 수업 확인 필요<br>
  <b>박스</b> — ★ KEY 외울 것 · ▣ DEFINITION 정의 · ❝ 원문 · TRAP 함정 · 🖼 그림 설명</div>
</section>
<section class="toc"><h2 class="th">목차</h2>{toc}</section>
<main class="doc">{body}</main>
</body></html>
