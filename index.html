<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FINAL QUEST · 2026 Fall</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
:root{
  --bg:#07080d; --bg2:#0e1019; --card:#12141f; --card2:#181b29; --line:#252a3d;
  --ink:#eef0ff; --sub:#8a90b0; --dim:#5b6080;
  --neon:#7c5cff; --neon2:#22d3ee; --good:#4ade80; --warn:#fb923c; --bad:#f43f5e;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6;min-height:100vh;
  background:
    radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.18),transparent 60%),
    radial-gradient(800px 500px at 110% 10%,rgba(34,211,238,.12),transparent 60%),
    var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:40px 40px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.lockbox{width:100%;max-width:380px;text-align:center}
.lockicon{width:84px;height:84px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;font-size:38px;
  background:linear-gradient(145deg,#1b1e30,#10121c);border:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(124,92,255,.25),0 0 40px rgba(124,92,255,.35);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(34,211,238,.35),0 0 60px rgba(34,211,238,.35)}}
.locktitle{font-size:12px;letter-spacing:.35em;color:var(--neon2);font-weight:700}
.lockh{font-size:30px;font-weight:900;margin:6px 0 4px;letter-spacing:-.02em}
.locksub{color:var(--sub);font-size:14px;margin-bottom:26px}
.pwrow{display:flex;gap:8px}
.pw{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);font-size:16px;outline:none;transition:.2s}
.pw:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
.go{padding:0 20px;border-radius:14px;font-weight:800;background:linear-gradient(135deg,var(--neon),var(--neon2));color:#06070c}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;color:var(--sub);font-size:13px;cursor:pointer}
.remember input{accent-color:var(--neon)}
.err{color:var(--bad);font-size:13px;height:20px;margin-top:10px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- app ---------- */
#app{display:none;max-width:1040px;overflow-x:auto;margin:0 auto;padding:22px 18px 80px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#06070c;
  background:linear-gradient(135deg,var(--neon),var(--neon2));box-shadow:0 0 24px rgba(124,92,255,.5)}
.brand b{font-size:17px;letter-spacing:.06em}
.brand small{display:block;color:var(--sub);font-size:11px;letter-spacing:.12em;margin-top:-3px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px}
.tabs button{padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub)}
.tabs button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:15px}

.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:22px}
.panel{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.label{font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:800;text-transform:uppercase}
.next .big{font-size:56px;font-weight:900;line-height:1;margin:8px 0 6px;letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff,var(--c,#a5b4fc));-webkit-background-clip:text;background-clip:text;color:transparent}
.next .what{color:var(--sub);font-size:14px}
.next .what b{color:var(--ink)}
.xp .lv{display:flex;align-items:baseline;gap:8px;margin:8px 0 12px}
.xp .lv b{font-size:34px;font-weight:900}
.xp .lv span{color:var(--sub);font-size:13px}
.bar{height:12px;border-radius:99px;background:#0a0b12;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--neon),var(--neon2));box-shadow:0 0 16px rgba(34,211,238,.6);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xp .meta{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-top:8px}

.sectionh{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}
.sectionh h2{font-size:15px;letter-spacing:.08em}
.sectionh span{color:var(--dim);font-size:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;text-align:left}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(300px 120px at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:0 10px 30px -10px color-mix(in srgb,var(--c) 60%,transparent)}
.card.done{opacity:.5}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:relative;z-index:1}
.card .abbr{font-size:22px;font-weight:900;letter-spacing:-.02em}
.card .code{color:var(--sub);font-size:12px}
.card .dd{font-weight:900;font-size:15px;padding:4px 9px;border-radius:9px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);white-space:nowrap}
.card .when{color:var(--sub);font-size:12.5px;margin:12px 0 10px;position:relative;z-index:1}
.card .prog{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.card .prog .bar{flex:1;height:7px}
.card .prog .bar i{background:var(--c);box-shadow:0 0 10px var(--c)}
.card .prog small{color:var(--sub);font-size:12px;min-width:38px;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
.pill.확정{background:rgba(74,222,128,.14);color:var(--good)}
.pill.추정{background:rgba(251,146,60,.14);color:var(--warn)}
.pill.미정{background:rgba(138,144,176,.16);color:var(--sub)}
.pill.pnr{background:rgba(124,92,255,.16);color:#b4a5ff}

.alert{margin-top:16px;border:1px solid rgba(251,146,60,.35);background:rgba(251,146,60,.07);border-radius:14px;padding:12px 14px;font-size:13.5px;color:#fed7aa}

/* subject page */
.back{color:var(--sub);font-size:13px;font-weight:700;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}
.shead{border-radius:22px;padding:24px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));
  background:radial-gradient(500px 200px at 0% 0%,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%),var(--card);margin-bottom:14px}
.shead .t{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.shead h1{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.shead .nm{color:var(--sub);font-size:14px;margin-top:2px}
.shead .ddbig{font-size:40px;font-weight:900;color:var(--c);text-shadow:0 0 24px color-mix(in srgb,var(--c) 60%,transparent);line-height:1}
.shead .ddbig small{display:block;font-size:12px;color:var(--sub);font-weight:600;text-shadow:none;text-align:right;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px}
.chip b{color:var(--sub);font-weight:600;margin-right:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box h3{font-size:12px;letter-spacing:.18em;color:var(--dim);margin-bottom:8px}
.box p{font-size:14px}
.box ul{padding-left:18px;font-size:14px}
.box li{margin:3px 0}
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:.2s}
.stage.clear{border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,transparent),var(--card))}
.stage .no{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:13px;background:var(--bg2);border:1px solid var(--line);color:var(--sub)}
.stage.clear .no{background:var(--c);color:#06070c;border-color:transparent;box-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}
.stage .tt{flex:1;min-width:0}
.stage .tt b{display:block;font-size:14.5px;font-weight:700}
.stage .tt small{color:var(--dim);font-size:12px}
.stage .tt small.ok{color:var(--good)}
.stage .tt small.todo{color:var(--warn)}
.card .np{position:relative;z-index:1;color:var(--sub);font-size:12px;margin-top:8px}
.stage .act{display:flex;gap:6px;flex:none}
.sbtn{font-size:12px;font-weight:800;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--sub);white-space:nowrap}
.sbtn.on{background:var(--c);color:#06070c;border-color:transparent}
.sbtn.note{color:var(--ink)}

/* markdown */
.md{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;font-size:15px;overflow-wrap:anywhere}
.md h1{font-size:26px;margin:4px 0 14px;line-height:1.3}
.md h2{font-size:20px;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.md h3{font-size:16.5px;margin:20px 0 8px;color:#c7cbff}
.md h4{font-size:15px;margin:16px 0 6px}
.md p{margin:8px 0}
.md ul,.md ol{padding-left:22px;margin:8px 0}
.md li{margin:3px 0}
.md a{color:var(--neon2)}
.md strong{color:#fff}
.md hr{border:0;border-top:1px dashed var(--line);margin:24px 0}
.md blockquote{border-left:3px solid var(--neon);background:rgba(124,92,255,.07);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;color:#d6d9f5}
.md code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.88em;background:#0a0b12;border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.md pre{background:#0a0b12;border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;margin:12px 0}
.md pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.55}
.md table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13.5px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--bg2);color:var(--sub);font-weight:700}
.md input[type=checkbox]{accent-color:var(--neon);margin-right:6px}
.empty{color:var(--sub);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:var(--r);font-size:14px}

.notehead{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.notehead b{font-size:18px}
.toc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;position:sticky;top:8px;z-index:5}
.toc summary{cursor:pointer;padding:10px 14px;font-weight:800;font-size:13.5px;color:var(--sub)}
.toc #tocl{max-height:55vh;overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column}
.toc a{color:var(--ink);text-decoration:none;font-size:13.5px;padding:5px 8px;border-radius:8px}
.toc a:hover{background:var(--card2)}
.toc a.h3{padding-left:22px;color:var(--sub);font-size:12.5px}
.notenav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.libtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.libtabs button{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center}
.libtabs button small{font-size:11px;color:var(--sub);background:var(--bg2);border-radius:99px;padding:0 7px}
.libtabs button.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px color-mix(in srgb,var(--c) 40%,transparent)}
.liblist{display:flex;flex-direction:column;gap:8px}
.libitem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;transition:.15s}
.libitem:not(.off):hover{border-color:var(--c);transform:translateX(3px)}
.libitem.off{opacity:.45;cursor:default}
.libitem .no{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:13px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.libitem .tt{flex:1;font-weight:700;font-size:14.5px}
.libitem .st{font-size:12px;color:var(--sub);white-space:nowrap}
.libitem:not(.off) .st{color:var(--c);font-weight:800}
.pdfbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;color:var(--sub);font-size:13px;position:sticky;top:8px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
#pdfpages{display:flex;flex-direction:column;gap:10px;min-width:100%}
.pdfpage{background:#fff;border-radius:6px;overflow:hidden;width:100%;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.pdfpage canvas{display:block;width:100%;height:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--card2);border:1px solid var(--line);
  padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;transition:.3s;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:720px){
  .hero,.two{grid-template-columns:1fr}
  .next .big{font-size:46px}
  .shead h1{font-size:26px}
  .md{padding:18px;font-size:14.5px}
  .tabs button{padding:7px 10px}
  .brand small{display:none}
}
</style>
</head>
<body>

<div id="lock">
  <form class="lockbox" id="lockform" autocomplete="off">
    <div class="lockicon">🔒</div>
    <div class="locktitle">FINAL QUEST · 2026 FALL</div>
    <div class="lockh">STAGE LOCKED</div>
    <div class="locksub">비밀번호를 입력해서 잠금을 해제하세요</div>
    <div class="pwrow">
      <input class="pw" id="pw" type="password" placeholder="password" autocomplete="current-password">
      <button class="go" type="submit">▶</button>
    </div>
    <label class="remember"><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app">
  <div class="top">
    <div class="brand" onclick="location.hash='#/'">
      <div class="logo">FQ</div>
      <div><b>FINAL QUEST</b><small>KAIST · 2026 FALL</small></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="tabs"><button data-t="home">스테이지</button><button data-t="lib">정리본</button><button data-t="plan">공략집</button></div>
      <button class="iconbtn" id="logout" title="잠그기">⏻</button>
    </div>
  </div>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const LS_KEY = "fq-key", LS_CHECK = "fq-check";
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
let DATA = null, ENC = null, KEY = null; const NOTES = {};

const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
  del(k){ try { localStorage.removeItem(k) } catch {} }
};

async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function unseal(e, key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(e.iv)}, key, b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadNotes(sid){
  if (NOTES[sid]) return NOTES[sid];
  const v = (DATA.notesVer || {})[sid] || "";
  const e = await (await fetch(`notes/${sid}.enc?v=${v}`)).json();
  return NOTES[sid] = await unseal(e, KEY);
}
const PDFS = {};
const pdfList = sid => ((DATA.pdfs || {})[sid] || []);
async function loadPdf(sid, p){
  const k = sid + "/" + p.id; if (PDFS[k]) return PDFS[k];
  const buf = new Uint8Array(await (await fetch(`pdfs/${sid}/${encodeURIComponent(p.id)}.bin?v=${p.ver}`)).arrayBuffer());
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, KEY, buf.slice(12));
  return PDFS[k] = new Uint8Array(pt);
}
const hasNote = (sid, cid) => ((DATA.notesAvailable || {})[sid] || []).includes(cid);
async function openWith(key){
  const d = await unseal(ENC, key); KEY = key; return d;
}

async function boot(){
  ENC = await (await fetch("data.enc?" + Date.now())).json();
  const saved = store.get(LS_KEY, null);
  if (saved && saved.salt === ENC.salt){
    try {
      const k = await crypto.subtle.importKey("raw", b64(saved.raw), "AES-GCM", false, ["decrypt"]);
      DATA = await openWith(k); return start();
    } catch { store.del(LS_KEY) }
  }
  $("#pw").focus();
}

$("#lockform").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("#pw").value; if (!pw) return;
  $("#err").textContent = "해제 중…";
  try {
    const k = await deriveKey(pw, b64(ENC.salt), ENC.iter);
    DATA = await openWith(k);
    if ($("#rem").checked) store.set(LS_KEY, {salt:ENC.salt, raw:ub64(await crypto.subtle.exportKey("raw", k))});
    start();
  } catch {
    $("#err").textContent = "비밀번호가 틀렸어요";
    const f = $(".lockbox"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    $("#pw").select();
  }
});
$("#logout").onclick = () => { store.del(LS_KEY); location.hash = ""; location.reload(); };

function start(){
  $("#lock").style.display = "none"; $("#app").style.display = "block";
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => location.hash = b.dataset.t === "home" ? "#/" : "#/" + b.dataset.t);
  window.addEventListener("hashchange", route); route();
}

/* ---------- helpers ---------- */
const DAYS = ["일","월","화","수","목","금","토"];
const examDate = s => new Date(s.exam + ":00+09:00");
function dday(s){
  const d = examDate(s), n = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const diff = Math.round((a - b) / 864e5);
  const over = n > new Date(d.getTime() + 3*3600e3);
  return {diff, over, label: over ? "CLEAR" : diff > 0 ? "D-" + diff : "D-DAY"};
}
const when = s => { const d = examDate(s); return `${d.getMonth()+1}/${d.getDate()}(${DAYS[d.getDay()]}) ${s.exam.slice(11)}–${s.end}`; };
const checks = () => store.get(LS_CHECK, {});
const isDone = (sid, cid) => !!checks()[sid + "/" + cid];
function noteProg(s){ const L = s.chapters.filter(c => !c.lab); const d = L.filter(c => c.noted).length; return {d, n:L.length}; }
function progress(s){ const n = s.chapters.length; const d = s.chapters.filter(c => isDone(s.id, c.id)).length; return {d, n, p: n ? Math.round(d/n*100) : 0}; }
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1400); }
function md(text){
  const html = window.marked ? marked.parse(text, {gfm:true, breaks:false}) : "<pre>" + esc(text) + "</pre>";
  return html;
}
function mathify(el){
  if (window.renderMathInElement) renderMathInElement(el, {delimiters:[
    {left:"$$", right:"$$", display:true}, {left:"\\[", right:"\\]", display:true},
    {left:"$", right:"$", display:false}, {left:"\\(", right:"\\)", display:false}], throwOnError:false});
}

/* ---------- views ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/, "").split("/");
  const tab = h[0] === "plan" ? "plan" : (h[0] === "lib" || h[0] === "n" || h[0] === "p") ? "lib" : "home";
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  window.scrollTo(0, 0);
  if (h[0] === "plan") return viewPlan();
  if (h[0] === "lib") return viewLib(h[1]);
  if (h[0] === "p" && h[1] && h[2]) return viewPdf(h[1], decodeURIComponent(h[2]));
  if (h[0] === "s" && h[1]) return viewSubject(h[1]);
  if (h[0] === "n" && h[1] && h[2]) return viewNote(h[1], decodeURIComponent(h[2]));
  viewHome();
}

function viewHome(){
  const S = DATA.subjects;
  const upcoming = S.filter(s => !dday(s).over).sort((a, b) => examDate(a) - examDate(b));
  const nx = upcoming[0];
  const all = S.reduce((a, s) => { const p = progress(s); a.d += p.d; a.n += p.n; return a; }, {d:0, n:0});
  const pct = all.n ? Math.round(all.d / all.n * 100) : 0;
  const lv = Math.floor(all.d / 5) + 1;
  $("#view").innerHTML = `
    <div class="hero">
      <div class="panel next" style="--c:${nx ? nx.color : "#a5b4fc"}">
        <div class="label">NEXT BOSS</div>
        <div class="big">${nx ? dday(nx).label : "ALL CLEAR"}</div>
        <div class="what">${nx ? `<b>${esc(nx.abbr)}</b> · ${when(nx)}` : "기말 끝! 수고했어요 🎉"}</div>
      </div>
      <div class="panel xp">
        <div class="label">TOTAL XP</div>
        <div class="lv"><b>LV.${lv}</b><span>${all.d} / ${all.n} 스테이지 클리어</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="meta"><span>${pct}%</span><span>기말 주간 ${esc(DATA.examWeek)}</span></div>
      </div>
    </div>
    <div class="sectionh"><h2>🗺️ STAGES</h2><span>시험 순서</span></div>
    <div class="grid">${[...S].sort((a,b) => examDate(a) - examDate(b)).map(s => {
      const d = dday(s), p = progress(s);
      return `<button class="card ${d.over ? "done" : ""}" style="--c:${s.color}" onclick="location.hash='#/s/${s.id}'">
        <div class="row"><div><div class="abbr">${esc(s.abbr)}</div><div class="code">${esc(s.code)} · ${esc(s.prof)}</div></div><div class="dd">${d.label}</div></div>
        <div class="when">${when(s)}<br>${s.pnr ? '<span class="pill pnr">PNR</span>' : `<span class="pill" style="background:rgba(255,255,255,.06);color:var(--sub)">${esc(s.weight)}</span>`} <span class="pill ${s.rangeStatus}">범위 ${s.rangeStatus}</span></div>
        <div class="prog"><div class="bar"><i style="width:${p.p}%"></i></div><small>${p.d}/${p.n}</small></div>
        <div class="np">📒 정리 ${noteProg(s).d}/${noteProg(s).n}</div>
      </button>`;}).join("")}
    </div>
    <div class="alert">⚠️ 화 19:00 미2 → 수 09:00 데구 → 수 13:00 PL 연속. 데구–PL 사이 80분뿐 → 데구·PL은 12/13까지 완성!</div>
    <p style="color:var(--dim);font-size:12px;text-align:center;margin-top:24px">업데이트 ${esc(DATA.updated)} · 체크 기록은 이 기기에만 저장돼요</p>`;
}

function viewSubject(id){
  const s = DATA.subjects.find(x => x.id === id); if (!s) return viewHome();
  const d = dday(s), p = progress(s);
  $("#view").innerHTML = `
    <button class="back" onclick="location.hash='#/'">← 스테이지 맵</button>
    <div class="shead" style="--c:${s.color}">
      <div class="t">
        <div><h1>${esc(s.abbr)}</h1><div class="nm">${esc(s.name)} · ${esc(s.code)} · ${esc(s.prof)}</div></div>
        <div class="ddbig">${d.label}<small>${when(s)}</small></div>
      </div>
      <div class="chips">
        <div class="chip"><b>비중</b>${esc(s.weight)}</div>
        <div class="chip"><b>범위</b><span class="pill ${s.rangeStatus}">${s.rangeStatus}</span></div>
        <div class="chip"><b>진행</b>${p.d}/${p.n} 클리어 (${p.p}%)</div>
        <div class="chip"><b>정리</b>${noteProg(s).d}/${noteProg(s).n} 강의</div>
      </div>
    </div>
    <div class="two">
      <div class="box"><h3>📍 시험 범위</h3><p>${esc(s.range)}</p><h3 style="margin-top:14px">📝 형식</h3><p>${esc(s.format)}</p></div>
      <div class="box"><h3>⚠️ 공략 팁</h3><ul>${(s.tips||[]).map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
    </div>
    <div class="sectionh"><h2>🎮 STAGE LIST</h2><span>클리어 체크는 이 기기에 저장</span></div>
    <div class="stages" style="--c:${s.color}">${s.chapters.map(c => {
      const done = isDone(s.id, c.id), has = hasNote(s.id, c.id);
      return `<div class="stage ${done ? "clear" : ""}">
        <div class="no">${esc(c.id)}</div>
        <div class="tt"><b>${esc(c.title)}</b><small class="${c.lab ? "" : c.noted ? "ok" : "todo"}">${c.lab ? "🧪 Lab" : c.noted ? "📒 정리 완료" : "⏳ 정리 필요"}</small></div>
        <div class="act">
          ${has ? `<button class="sbtn note" onclick="location.hash='#/n/${s.id}/${encodeURIComponent(c.id)}'">노트</button>` : ""}
          <button class="sbtn ${done ? "on" : ""}" onclick="toggle('${s.id}','${esc(c.id)}')">${done ? "✓ CLEAR" : "클리어"}</button>
        </div></div>`;}).join("")}
    </div>`;
}

function toggle(sid, cid, inNote){
  const c = checks(), k = sid + "/" + cid;
  if (c[k]) delete c[k]; else { c[k] = 1; toast("STAGE CLEAR! +1 XP ⚡"); }
  store.set(LS_CHECK, c);
  if (inNote) { const b = document.querySelector(".notenav .sbtn:nth-child(2)"); if (b) { b.classList.toggle("on", !!c[k]); b.textContent = c[k] ? "✓ CLEAR" : "다 봤으면 클리어"; } }
  else viewSubject(sid);
}

async function viewNote(sid, cid){
  const s = DATA.subjects.find(x => x.id === sid);
  if (!s || !hasNote(sid, cid)) return viewSubject(sid);
  const L = s.chapters.filter(c => hasNote(sid, c.id)), i = L.findIndex(c => c.id === cid);
  const prev = L[i-1], next = L[i+1], ch = L[i];
  const nav = `<div class="notenav" style="--c:${s.color}">
      ${prev ? `<button class="sbtn" onclick="location.hash='#/n/${sid}/${encodeURIComponent(prev.id)}'">← ${esc(prev.id)}</button>` : "<span></span>"}
      <button class="sbtn ${isDone(sid, cid) ? "on" : ""}" onclick="toggle('${sid}','${esc(cid)}', true)">${isDone(sid, cid) ? "✓ CLEAR" : "다 봤으면 클리어"}</button>
      ${next ? `<button class="sbtn" onclick="location.hash='#/n/${sid}/${encodeURIComponent(next.id)}'">${esc(next.id)} →</button>` : "<span></span>"}
    </div>`;
  $("#view").innerHTML = `<button class="back" onclick="location.hash='#/lib/${sid}'">← ${esc(s.abbr)} 정리본</button>
    <div class="notehead" style="--c:${s.color}"><span class="pill" style="background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)">${esc(s.abbr)} · ${esc(cid)}</span><b>${esc(ch.title)}</b></div>
    <details class="toc" id="toc"><summary>📑 목차</summary><div id="tocl"></div></details>
    <article class="md" id="mdbox"><p style="color:var(--sub)">노트 여는 중…</p></article>${nav}`;
  let n;
  try { n = (await loadNotes(sid))[cid]; } catch { $("#mdbox").innerHTML = "<p>노트를 불러오지 못했어요. 새로고침해 주세요.</p>"; return; }
  const el = $("#mdbox"); el.innerHTML = md(n); mathify(el);
  const hs = [...el.querySelectorAll("h1,h2,h3")];
  hs.forEach((h, k) => h.id = "h" + k);
  $("#tocl").innerHTML = hs.filter(h => h.tagName !== "H1").map(h => `<a class="${h.tagName.toLowerCase()}" href="javascript:void 0" onclick="document.getElementById('${h.id}').scrollIntoView({behavior:'smooth'});document.getElementById('toc').open=false">${esc(h.textContent)}</a>`).join("");
}

async function viewPdf(sid, pid){
  const s = DATA.subjects.find(x => x.id === sid), p = pdfList(sid).find(x => x.id === pid);
  if (!s || !p) return viewLib(sid);
  $("#view").innerHTML = `<button class="back" onclick="location.hash='#/lib/${sid}'">← ${esc(s.abbr)} 정리본</button>
    <div class="notehead" style="--c:${s.color}"><span class="pill" style="background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)">${esc(s.abbr)} · PDF</span><b>${esc(p.title)}</b></div>
    <div class="pdfbar"><span id="pdfinfo">불러오는 중… (${(p.size/1e6).toFixed(1)}MB)</span>
      <span><button class="sbtn" id="zout">−</button> <button class="sbtn" id="zin">+</button> <button class="sbtn" id="pdfdl">저장</button></span></div>
    <div id="pdfpages"></div>`;
  let bytes;
  try { bytes = await loadPdf(sid, p); } catch { $("#pdfinfo").textContent = "PDF를 불러오지 못했어요. 새로고침해 주세요."; return; }
  $("#pdfdl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"})); a.download = p.id + ".pdf"; a.click(); };
  if (!window.pdfjsLib) { $("#pdfinfo").textContent = "뷰어를 불러오지 못했어요 — '저장'으로 내려받아 보세요."; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  const doc = await pdfjsLib.getDocument({data: bytes.slice()}).promise;
  const box = $("#pdfpages"); let zoom = 1;
  $("#pdfinfo").textContent = `${doc.numPages}쪽`;
  const first = await doc.getPage(1), vp1 = first.getViewport({scale:1});
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++){
    const d = document.createElement("div"); d.className = "pdfpage"; d.dataset.n = i;
    d.style.aspectRatio = vp1.width + "/" + vp1.height; box.appendChild(d); pages.push(d);
  }
  const render = async d => {
    if (d.dataset.done === String(zoom)) return; d.dataset.done = String(zoom);
    const pg = await doc.getPage(+d.dataset.n), w = d.clientWidth, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const vp = pg.getViewport({scale: w / pg.getViewport({scale:1}).width * dpr});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    await pg.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
    d.innerHTML = ""; d.style.aspectRatio = vp.width + "/" + vp.height; d.appendChild(c);
  };
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && render(e.target)), {rootMargin: "800px 0px"});
  pages.forEach(d => io.observe(d));
  const setZoom = z => { zoom = Math.max(1, Math.min(3, z)); box.style.width = (zoom * 100) + "%"; pages.forEach(d => { if (d.getBoundingClientRect().top < innerHeight + 800 && d.getBoundingClientRect().bottom > -800) render(d); }); };
  $("#zin").onclick = () => setZoom(zoom + .5); $("#zout").onclick = () => setZoom(zoom - .5);
}

function viewLib(sel){
  const S = [...DATA.subjects].sort((a,b) => examDate(a) - examDate(b));
  const cur = S.find(s => s.id === sel) || S.find(s => pdfList(s.id).length || ((DATA.notesAvailable||{})[s.id]||[]).length) || S[0];
  $("#view").innerHTML = `
    <div class="sectionh"><h2>📚 정리본</h2><span>과목을 고르고 강의를 누르면 바로 열려요</span></div>
    <div class="libtabs">${S.map(s => { const n = ((DATA.notesAvailable||{})[s.id]||[]).length + pdfList(s.id).length;
      return `<button class="${s.id === cur.id ? "on" : ""}" style="--c:${s.color}" onclick="location.hash='#/lib/${s.id}'">${esc(s.abbr)}<small>${n}</small></button>`; }).join("")}</div>
    ${pdfList(cur.id).length ? `<div class="label" style="margin:4px 2px 8px">📄 정리 PDF</div>
    <div class="liblist" style="--c:${cur.color};margin-bottom:18px">${pdfList(cur.id).map(p => `
      <button class="libitem" onclick="location.hash='#/p/${cur.id}/${encodeURIComponent(p.id)}'">
        <span class="no">PDF</span><span class="tt">${esc(p.title)}</span><span class="st">${(p.size/1e6).toFixed(1)}MB · 열기 →</span></button>`).join("")}</div>
    <div class="label" style="margin:4px 2px 8px">📒 강의별 노트</div>` : ""}
    <div class="liblist" style="--c:${cur.color}">${cur.chapters.filter(c => !c.lab).map(c => {
      const has = hasNote(cur.id, c.id);
      return `<button class="libitem ${has ? "" : "off"}" ${has ? `onclick="location.hash='#/n/${cur.id}/${encodeURIComponent(c.id)}'"` : "disabled"}>
        <span class="no">${esc(c.id)}</span><span class="tt">${esc(c.title)}</span>
        <span class="st">${has ? "열기 →" : c.noted ? "사이트 업로드 전" : "정리 전"}</span></button>`; }).join("")}
    </div>`;
}

function viewPlan(){
  $("#view").innerHTML = `<article class="md" id="mdbox"><h1>📘 공략집 — 기말 공부 계획</h1></article>`;
  const el = $("#mdbox"); el.insertAdjacentHTML("beforeend", md(DATA.plan)); mathify(el);
}

window.addEventListener("load", boot);
</script>
</body>
</html>
